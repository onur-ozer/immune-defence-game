        }} />
      ))}
    </div>
  );
}

function HLACardGame() {
  const [gameState, setGameState] = useState('initial');
  const [playerAlleles, setPlayerAlleles] = useState([]);
  const [currentPathogen, setCurrentPathogen] = useState(null);
  const [health, setHealth] = useState(20);
  const [combatResult, setCombatResult] = useState(null);
  const [round, setRound] = useState(0);
  const [battleLog, setBattleLog] = useState([]);
  const [credits, setCredits] = useState(0);
  const [modifierHand, setModifierHand] = useState([]);
  const [marketModifiers, setMarketModifiers] = useState([]);
  const [shopAlleles, setShopAlleles] = useState([]);
  const [marketTab, setMarketTab] = useState('modifiers');
  const [swapMode, setSwapMode] = useState(null);
  const [swapNotice, setSwapNotice] = useState(null);
  const [currentEvent, setCurrentEvent] = useState(null);
  const [encounteredPathogens, setEncounteredPathogens] = useState({}); // {id: count}
  const [memoryNotification, setMemoryNotification] = useState(null); // {type, pathogenName, value}
  const [antibioticResistance, setAntibioticResistance] = useState(0);
  const [activeEffects, setActiveEffects] = useState([]);
  const [combatPreview, setCombatPreview] = useState(null);
  const [playedModifiers, setPlayedModifiers] = useState([]);
  const [alleleNotification, setAlleleNotification] = useState(null);
  const [crisprTagSelection, setCrisprTagSelection] = useState(null);
  const [neutralizeTagSelection, setNeutralizeTagSelection] = useState(null);
  const [nullAlleles, setNullAlleles] = useState([]);
  const [shakingDamage, setShakingDamage] = useState(false);
  const [resultFlash, setResultFlash] = useState(null); // 'win' | 'lose' | null

  useEffect(() => { startNewGame(); }, []);

  const startNewGame = () => {
    const alleles = drawInitialAlleles();
    setPlayerAlleles(alleles);
    setCredits(5); setHealth(20); setRound(0);
    setCombatResult(null); setBattleLog([]); setModifierHand([]);
    setMarketModifiers([]); setShopAlleles([]); setMarketTab('modifiers');
    setSwapMode(null); setSwapNotice(null); setCurrentEvent(null);
    setEncounteredPathogens({}); setMemoryNotification(null);
    setAntibioticResistance(0);
    setActiveEffects([]); setCombatPreview(null);
    setPlayedModifiers([]); setAlleleNotification(null); setCrisprTagSelection(null);
    setNeutralizeTagSelection(null);
    setNullAlleles([]);
    setShakingDamage(false); setResultFlash(null);
    setGameState('ready');
  };

  const drawPathogen = (extraEffects = []) => {
    // Restore NULL alleles from previous round
    if (nullAlleles.length > 0) {
      const newAlleles = [...playerAlleles];
      nullAlleles.forEach(index => {
        const isGeneA = index < 2;
        const allGeneAlleles = isGeneA ? Object.values(ALLELES.geneA).flat() : Object.values(ALLELES.geneB).flat();
        newAlleles[index] = shuffleArray(allGeneAlleles)[0];
      });
      setPlayerAlleles(newAlleles);
      setNullAlleles([]);
    }

    // Pick random pathogen — harderPathogen effect filters the pool to level 5+
    const harderEffect = activeEffects.find(e => e.type === 'harderPathogen');
    let pool = PATHOGENS;
    if (harderEffect) {
      const hard = PATHOGENS.filter(p => p.level >= 5);
      if (hard.length > 0) pool = hard;
    }
    const nextPathogen = pool[Math.floor(Math.random() * pool.length)];
    const newActiveEffects = [...activeEffects.filter(e => e.type !== 'harderPathogen'), ...extraEffects];

    // ── Immune memory roll — check BEFORE incrementing the counter ─────────
    // 60% boost (+3 combat), 30% original antigenic sin (-2 combat), 10% nothing
    const timesEncountered = encounteredPathogens[nextPathogen.id] || 0;
    let memoryEffect = null;
    let memNote = null;
    if (timesEncountered > 0) {
      const roll = Math.random();
      if (roll < 0.60) {
        memoryEffect = { type: 'memoryBoost', value: 3 };
        memNote = { outcome: 'boost', pathogenName: nextPathogen.name, value: 3, times: timesEncountered };
      } else if (roll < 0.90) {
        memoryEffect = { type: 'memoryPenalty', value: 2 };
        memNote = { outcome: 'penalty', pathogenName: nextPathogen.name, value: 2, times: timesEncountered };
      } else {
        memNote = { outcome: 'none', pathogenName: nextPathogen.name, times: timesEncountered };
      }
    }

    // Apply pathogen power modifications from active effects — track separately for display
    let modifiedPathogen = { ...nextPathogen, basePower: nextPathogen.power, curseBonus: 0 };
    newActiveEffects.forEach(effect => {
      if (effect.type === 'pathogenBoost') {
        const boosted = effect.percent
          ? Math.ceil(modifiedPathogen.basePower * (1 + effect.value))
          : modifiedPathogen.basePower + effect.value;
        modifiedPathogen.curseBonus = boosted - modifiedPathogen.basePower;
        modifiedPathogen.power = boosted;
      }
    });

    const battleEffects = memoryEffect ? [...newActiveEffects, memoryEffect] : newActiveEffects;

    setMemoryNotification(memNote);
    setCurrentPathogen(modifiedPathogen);
    setRound(r => r + 1);
    setPlayedModifiers([]);
    setActiveEffects(battleEffects);
    // Track draw immediately (not just after fight) so Seen counter is accurate
    setEncounteredPathogens(prev => ({ ...prev, [nextPathogen.id]: (prev[nextPathogen.id] || 0) + 1 }));
    setCombatPreview(calculateCombat(playerAlleles, modifiedPathogen, [], battleEffects, antibioticResistance));
    setGameState('combat');
    setCombatResult(null);
  };

  const playModifier = (modifier) => {
    const noBoosts = activeEffects.find(e => e.type === 'noBoosts');
    if (noBoosts && modifier.type === 'boost') return;
    if (modifier.effect === 'flee') {
      setModifierHand(modifierHand.filter(m => m.id !== modifier.id));
      drawPathogen([{ type: 'combatPenalty', value: 2, reason: 'herdImmunity' }]);
      return;
    }
    if (modifier.effect === 'quarantine') { setModifierHand(modifierHand.filter(m => m.id !== modifier.id)); drawPathogen(); return; }
    if (modifier.effect === 'crispr') { setCrisprTagSelection(modifier); return; }
    if (modifier.effect === 'neutralize') { setNeutralizeTagSelection(modifier); return; }
    if (modifier.effect === 'boosterVaccine') {
      const hasPenalty = activeEffects.some(e => e.type === 'memoryPenalty');
      const newActiveEffects = hasPenalty
        ? [...activeEffects.filter(e => e.type !== 'memoryPenalty'), { type: 'memoryBoost', value: 3 }]
        : [...activeEffects, { type: 'combatBonus', value: 2, label: 'Booster Vaccine' }];
      setActiveEffects(newActiveEffects);
      const newPlayed = [...playedModifiers, modifier];
      setPlayedModifiers(newPlayed);
      setModifierHand(modifierHand.filter(m => m.id !== modifier.id));
      setCombatPreview(calculateCombat(playerAlleles, currentPathogen, newPlayed, newActiveEffects, antibioticResistance));
      return;
    }
    const newPlayed = [...playedModifiers, modifier];
    setPlayedModifiers(newPlayed);
    setModifierHand(modifierHand.filter(m => m.id !== modifier.id));
    setCombatPreview(calculateCombat(playerAlleles, currentPathogen, newPlayed, activeEffects, antibioticResistance));
  };

  const selectNeutralizeTag = (tag) => {
    if (!neutralizeTagSelection) return;
    const neutralizeWithTag = { ...neutralizeTagSelection, selectedTag: tag };
    const newPlayed = [...playedModifiers, neutralizeWithTag];
    setPlayedModifiers(newPlayed);
    setModifierHand(modifierHand.filter(m => m.id !== neutralizeTagSelection.id));
    setNeutralizeTagSelection(null);
    setCombatPreview(calculateCombat(playerAlleles, currentPathogen, newPlayed, activeEffects, antibioticResistance));
  };

  const selectCrisprTag = (tag) => {
    if (!crisprTagSelection) return;
    const crisprWithTag = { ...crisprTagSelection, selectedTag: tag };
    const newPlayed = [...playedModifiers, crisprWithTag];
    setPlayedModifiers(newPlayed);
    setModifierHand(modifierHand.filter(m => m.id !== crisprTagSelection.id));
    setCrisprTagSelection(null);
    setCombatPreview(calculateCombat(playerAlleles, currentPathogen, newPlayed, activeEffects, antibioticResistance));
  };

  const fight = () => {
    const result = calculateCombat(playerAlleles, currentPathogen, playedModifiers, activeEffects, antibioticResistance);
    setCombatResult(result);

    // Antibiotic resistance — each use degrades effectiveness by 1
    const antibioticsUsed = playedModifiers.filter(m => m.effect === 'antibiotics').length;
    if (antibioticsUsed > 0) {
      setAntibioticResistance(r => r + antibioticsUsed);
    }

    if (result.win) {
      const reward = currentPathogen.reward;
      setCredits(credits + reward);
      setBattleLog([...battleLog, { round, pathogen: currentPathogen.name, result:'WIN', combat: result.combatValue, power: result.effectivePathogenPower, memory: memoryNotification?.outcome }]);
      setResultFlash('win'); setTimeout(() => setResultFlash(null), 900);
    } else {
      const damage = result.effectivePathogenPower - result.combatValue;
      setHealth(Math.max(0, health - damage));
      setBattleLog([...battleLog, { round, pathogen: currentPathogen.name, result:'LOSE', combat: result.combatValue, power: result.effectivePathogenPower, damage, memory: memoryNotification?.outcome }]);
      setShakingDamage(true); setTimeout(() => setShakingDamage(false), 600);
      setResultFlash('lose'); setTimeout(() => setResultFlash(null), 900);
      if (health - damage <= 0) { setGameState('gameover'); return; }
    }
    setActiveEffects([]); setPlayedModifiers([]);
    setGameState('result');
  };

  const proceedToEvent = () => {
    if (credits >= 40) { setGameState('victory'); return; }
    const geneADiv = calculateDivergence(playerAlleles[0], playerAlleles[1]);
    const geneBDiv = calculateDivergence(playerAlleles[2], playerAlleles[3]);
    const avgDiv   = (geneADiv + geneBDiv) / 2;
    const event = triggerRandomEvent(avgDiv);
    setCurrentEvent(event);
    if (event && event.type === 'curse') applyEventEffect(event.event, true);
    else if (event && event.type === 'bonus') applyEventEffect(event.event, false);
    setGameState('event');
  };

  const applyEventEffect = (event, isCurse) => {
    const effect = event.effect;
    if (effect === 'damage') { setHealth(h => Math.max(0, h - event.value)); }
    else if (effect === 'credits') { setCredits(c => c + event.value); }
    else if (effect === 'combined') { setHealth(h => Math.max(0, h - event.value.damage)); setActiveEffects(prev => [...prev, { type:'combatPenalty', value: event.value.combatPenalty }]); }
    else if (effect === 'freeModifier') { const tier1Mods = MODIFIERS.filter(m => m.cost <= 2); const freeMod = tier1Mods[Math.floor(Math.random() * tier1Mods.length)]; setModifierHand(prev => [...prev, { ...freeMod, id: Date.now() }]); }
    else if (effect === 'resetAntibiotics') { setAntibioticResistance(0); }
    else if (effect === 'disableAllele') {
      // Resolve which allele is disabled NOW, not during every combat calculation
      const nonNullIndices = playerAlleles
        .map((a, i) => a.name !== 'NULL' ? i : null)
        .filter(i => i !== null);
      const resolvedIndex = nonNullIndices[Math.floor(Math.random() * nonNullIndices.length)];
      setActiveEffects(prev => [...prev, { type: 'disableAlleleResolved', index: resolvedIndex }]);
    } else if (effect === 'randomTag') {
      // Resolve which tag is added NOW, not during every combat calculation
      const allTags = ['Viral-Envelope','RNA-Virus','DNA-Virus','Bacterial-Toxin','Gram-Positive','Gram-Negative','Intracellular','Extracellular','Immune-Evasion','Fungal','Parasite'];
      const resolvedTag = allTags[Math.floor(Math.random() * allTags.length)];
      setActiveEffects(prev => [...prev, { type: 'randomTagResolved', tag: resolvedTag }]);
    } else if (effect === 'loseTags') {
      // Keyed by position (not allele id) so it still applies correctly even if the
      // player swaps that slot's allele at the Genomic Lab before the next battle.
      const tagsToLose = playerAlleles.map((allele, position) => {
        if (allele.name === 'NULL' || allele.tags.length === 0) return null;
        const randomIndex = Math.floor(Math.random() * allele.tags.length);
        return { position, tagIndex: randomIndex, tag: allele.tags[randomIndex] };
      }).filter(x => x !== null);
      setActiveEffects(prev => [...prev, { type:'loseTags', tagsToLose }]);
    } else if (effect === 'randomMutation') {
      const randomIndex = Math.floor(Math.random() * 4);
      const isGeneA = randomIndex < 2;
      const oldAllele = playerAlleles[randomIndex];
      const isNull = Math.random() < 0.3;
      if (isNull) {
        const nullAllele = { id:`NULL-${Date.now()}`, name:'NULL', tags:[] };
        const newAlleles = [...playerAlleles]; newAlleles[randomIndex] = nullAllele;
        setPlayerAlleles(newAlleles); setNullAlleles([randomIndex]);
        setAlleleNotification({ type:'null_mutation', old: oldAllele.name, position: randomIndex, gene: isGeneA ? 'A' : 'B' });
        setTimeout(() => setAlleleNotification(null), 4000);
      } else {
        const allGeneAlleles = isGeneA ? Object.values(ALLELES.geneA).flat() : Object.values(ALLELES.geneB).flat();
        const newAllele = shuffleArray(allGeneAlleles)[0];
        const newAlleles = [...playerAlleles]; newAlleles[randomIndex] = newAllele;
        setPlayerAlleles(newAlleles);
        setAlleleNotification({ type:'curse_mutation', old: oldAllele.name, new: newAllele.name, position: randomIndex });
        setTimeout(() => setAlleleNotification(null), 4000);
      }
    } else if (effect === 'combatBonus') {
      setActiveEffects(prev => [...prev, { type: 'combatBonus', value: event.value, label: event.name || 'Combat Bonus' }]);
    } else {
      setActiveEffects(prev => [...prev, { type: effect, value: event.value, percent: event.percent }]);
    }
  };

  const proceedToMarket = () => {
    setMarketModifiers(getMarketModifiers());
    setShopAlleles(getShopAlleles());
    setMarketTab('modifiers');
    setSwapMode(null);
    setGameState('market');
  };

  const buyModifier = (modifier) => {
    if (credits >= modifier.cost) {
      setCredits(credits - modifier.cost);
      setModifierHand([...modifierHand, { ...modifier, id: Date.now() + Math.random() }]);
    }
  };

  const initSwap = (shopAllele) => {
    if (credits < 5) return;
    setSwapNotice(null);
    setSwapMode({ shopAllele });
  };

  const confirmSwap = (targetIndex) => {
    if (!swapMode) return;
    const { shopAllele } = swapMode;
    const shopIsGeneA = Object.values(ALLELES.geneA).flat().some(a => a.id === shopAllele.id);
    const targetIsGeneA = targetIndex < 2;
    if (shopIsGeneA !== targetIsGeneA) {
      // Wrong gene — show a brief notice instead of silently doing nothing
      const shopGeneLabel = shopIsGeneA ? 'A' : 'B';
      setSwapNotice(`${shopAllele.name} is a Gene ${shopGeneLabel} allele — select a Gene ${shopGeneLabel} position to replace.`);
      setTimeout(() => setSwapNotice(null), 3000);
      return;
    }
    setCredits(c => c - 5);
    const newAlleles = [...playerAlleles];
    newAlleles[targetIndex] = shopAllele;
    setPlayerAlleles(newAlleles);
    setSwapMode(null);
    setSwapNotice(null);
    // Remove swapped allele from shop
    setShopAlleles(prev => prev.filter(a => a.id !== shopAllele.id));
  };

  const skipMarket = () => { credits >= 40 ? setGameState('victory') : drawPathogen(); };

  /* ── RENDER ── */
  return (
    <div style={{ minHeight:'100vh', padding:'20px 16px', maxWidth:900, margin:'0 auto', position:'relative', zIndex:1 }} className={shakingDamage ? 'shake' : ''}>

      {/* Header */}
      <div style={{ textAlign:'center', marginBottom:20 }}>
        <h1 style={{ fontSize:30, fontWeight:700, letterSpacing:2, color:'var(--text)', marginBottom:4 }}>
          HLA Defense
        </h1>
        <p style={{ fontSize:13, color:'var(--text-dim)', letterSpacing:1 }}>Immunological Survival Game</p>
      </div>


      {/* Flash overlay */}
      {resultFlash && (
        <div className={resultFlash === 'win' ? 'win-flash-overlay' : 'lose-flash-overlay'}
          style={{ position:'fixed', inset:0, zIndex:200, pointerEvents:'none' }} />
      )}

      {/* Stats Bar */}
      {gameState !== 'initial' && (
        <StatsBar health={health} credits={credits} round={round}
          encountered={Object.keys(encounteredPathogens).length} handSize={modifierHand.length}
          antibioticResistance={antibioticResistance} />
      )}

      {/* Allele Panel (always visible except initial/end screens) */}
      {playerAlleles.length === 4 && !['initial','gameover','victory'].includes(gameState) && (
        <AllelesPanel alleles={playerAlleles}
          swapTargetMode={!!swapMode}
          onSelectSwap={confirmSwap} />
      )}

      {/* ─── READY ─── */}
      {gameState === 'ready' && (
        <div className="fade-in" style={{ textAlign:'center', marginTop:40 }}>
          <div className="panel" style={{ padding:'32px', maxWidth:400, margin:'0 auto 24px' }}>
            <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:4 }}>Survive endless waves of pathogens.</div>
            <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:24 }}>Reach 40 credits before losing all health.</div>
            <button className="btn-primary pulse" onClick={() => drawPathogen()}>
              <Shuffle /> DRAW PATHOGEN
            </button>
          </div>
        </div>
      )}

      {/* ─── COMBAT ─── */}
      {gameState === 'combat' && currentPathogen && (
        <div className="fade-in">
          {/* CRISPR Modal */}
          {crisprTagSelection && (
            <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.75)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100 }}>
              <div className="panel fade-in" style={{ padding:28, maxWidth:360, width:'90%' }}>
                <div style={{ fontSize:16, fontWeight:700, color:'#4a90d9', marginBottom:6, letterSpacing:1 }}>✂️ CRISPR EDIT</div>
                <div style={{ fontSize:13, color:'var(--text-dim)', marginBottom:16 }}>Select a pathogen tag to add to ALL your alleles:</div>
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {currentPathogen.tags.map((tag, idx) => (
                    <button key={idx} onClick={() => selectCrisprTag(tag)}
                      style={{ background:'rgba(191,95,255,0.1)', border:'1px solid rgba(191,95,255,0.4)', borderRadius:7, padding:'10px 14px', color:'var(--purple)', fontFamily:'JetBrains Mono,monospace', fontSize:13, cursor:'pointer', textAlign:'left', transition:'all 0.2s' }}
                      onMouseOver={e => e.target.style.background='rgba(191,95,255,0.25)'}
                      onMouseOut={e => e.target.style.background='rgba(191,95,255,0.1)'}>
                      {tag}
                    </button>
                  ))}
                </div>
                <button onClick={() => setCrisprTagSelection(null)} className="btn-secondary" style={{ marginTop:14, width:'100%' }}>Cancel</button>
              </div>
            </div>
          )}

          {/* Targeted Neutralizing Antibodies Modal */}
          {neutralizeTagSelection && (
            <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.75)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100 }}>
              <div className="panel fade-in" style={{ padding:28, maxWidth:360, width:'90%' }}>
                <div style={{ fontSize:16, fontWeight:700, color:'var(--green)', marginBottom:6, letterSpacing:1 }}>🎯 NEUTRALIZING ANTIBODIES</div>
                <div style={{ fontSize:13, color:'var(--text-dim)', marginBottom:16 }}>Select a tag to neutralize (−5 power if Immune-Evasion, −3 otherwise):</div>
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {currentPathogen.tags.map((tag, idx) => (
                    <button key={idx} onClick={() => selectNeutralizeTag(tag)}
                      style={{ background:'rgba(61,186,110,0.1)', border:'1px solid rgba(61,186,110,0.4)', borderRadius:7, padding:'10px 14px', color:'var(--green)', fontFamily:'JetBrains Mono,monospace', fontSize:13, cursor:'pointer', textAlign:'left', transition:'all 0.2s' }}
                      onMouseOver={e => e.target.style.background='rgba(61,186,110,0.25)'}
                      onMouseOut={e => e.target.style.background='rgba(61,186,110,0.1)'}>
                      {tag}
                    </button>
                  ))}
                </div>
                <button onClick={() => setNeutralizeTagSelection(null)} className="btn-secondary" style={{ marginTop:14, width:'100%' }}>Cancel</button>
              </div>
            </div>
          )}

          {/* Memory notification */}
          {memoryNotification && (
            <div className="fade-in" style={{ maxWidth:500, margin:'0 auto 14px',
              padding:'10px 16px', borderRadius:9, display:'flex', alignItems:'center', gap:10,
              background: memoryNotification.outcome === 'boost' ? '#1a3028' : memoryNotification.outcome === 'penalty' ? '#3d2828' : '#2e2e38',
              border: `1px solid ${memoryNotification.outcome === 'boost' ? '#2e6645' : memoryNotification.outcome === 'penalty' ? '#7a3a3a' : '#4a4f57'}` }}>
              <span style={{ fontSize:20 }}>
                {memoryNotification.outcome === 'boost' ? '🛡️' : memoryNotification.outcome === 'penalty' ? '⚠️' : '🔄'}
              </span>
              <div>
                <div style={{ fontSize:12, fontWeight:700, color: memoryNotification.outcome === 'boost' ? 'var(--green)' : memoryNotification.outcome === 'penalty' ? '#e07070' : 'var(--text-dim)' }}>
                  {memoryNotification.outcome === 'boost' ? 'Immune Memory — Protective Response' :
                   memoryNotification.outcome === 'penalty' ? 'Original Antigenic Sin' : 'Prior Exposure — No Response'}
                </div>
                <div style={{ fontSize:11, color:'var(--text-dim)', marginTop:2 }}>
                  {memoryNotification.pathogenName} encountered {memoryNotification.times}× before
                  {memoryNotification.outcome === 'boost' && ` · +${memoryNotification.value} combat this battle`}
                  {memoryNotification.outcome === 'penalty' && ` · −${memoryNotification.value} combat this battle`}
                </div>
              </div>
            </div>
          )}

          {/* Mutation notification */}
          {alleleNotification && (
            <div className="fade-in" style={{ maxWidth:500, margin:'0 auto 16px',
              padding:'14px 18px', borderRadius:10, textAlign:'center',
              background: alleleNotification.type === 'immune_memory' ? 'var(--green-light)' : 'var(--red-light)',
              border: `1px solid ${alleleNotification.type === 'immune_memory' ? '#86efac' : '#fca5a5'}` }}>
              {alleleNotification.type === 'immune_memory' && <><div style={{ fontSize:15, fontWeight:700, color:'var(--green)' }}>🛡️ Immune Memory Active</div><div style={{ fontSize:12, color:'var(--text-dim)', marginTop:4 }}>Auto-win vs {alleleNotification.pathogen}</div></>}
              {alleleNotification.type === 'curse_mutation' && <><div style={{ fontSize:15, fontWeight:700, color:'var(--red)' }}>⚠️ Random Mutation</div><div style={{ fontSize:12, color:'var(--text-dim)', marginTop:4 }}>{alleleNotification.old} → {alleleNotification.new}</div></>}
              {alleleNotification.type === 'null_mutation' && <><div style={{ fontSize:15, fontWeight:700, color:'var(--red)' }}>☠️ NULL Mutation — Gene {alleleNotification.gene}</div><div style={{ fontSize:12, color:'var(--text-dim)', marginTop:4 }}>{alleleNotification.old} → NULL (homozygous next round)</div></>}
            </div>
          )}

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16 }}>
            {/* Pathogen */}
            <PathogenCard key={`${round}-${currentPathogen.id}`} pathogen={currentPathogen} />

            {/* Combat Preview */}
            <div className="panel" style={{ padding:'20px 22px' }}>
              <div style={{ fontSize:11, letterSpacing:2, color:'var(--text-dim)', marginBottom:12, fontWeight:700 }}>COMBAT PREVIEW</div>
              {combatPreview && (
                <>
                  <div style={{ display:'flex', alignItems:'center', gap:12, justifyContent:'center', marginBottom:8 }}>
                    <div style={{ textAlign:'center' }}>
                      <div style={{ fontSize:10, color:'var(--text-dim)', letterSpacing:1, marginBottom:2 }}>YOURS</div>
                      <div className={`combat-number ${combatPreview.win ? 'win-text' : 'lose-text'}`}>{combatPreview.combatValue}</div>
                    </div>
                    <div style={{ fontSize:20, color:'var(--text-dim)', fontFamily:'JetBrains Mono,monospace' }}>vs</div>
                    <div style={{ textAlign:'center' }}>
                      <div style={{ fontSize:10, color:'var(--text-dim)', letterSpacing:1, marginBottom:2 }}>THREAT</div>
                      <div className="combat-number" style={{ color:'#e05555' }}>{combatPreview.effectivePathogenPower}</div>
                      {currentPathogen.curseBonus > 0 && (
                        <div style={{ fontSize:10, color:'#ff6b6b', marginTop:2, fontFamily:'JetBrains Mono,monospace' }}>
                          {currentPathogen.basePower} + ☠️{currentPathogen.curseBonus}
                        </div>
                      )}
                    </div>
                  </div>
                  <div style={{ textAlign:'center', marginBottom:14 }}>
                    <span style={{ fontSize:14, fontWeight:700, letterSpacing:2, color: combatPreview.win ? 'var(--green)' : 'var(--red)' }}>
                      {combatPreview.win ? '✓ VICTORY' : '✗ DEFEAT'} {!combatPreview.win && `(−${combatPreview.effectivePathogenPower - combatPreview.combatValue} HP)`}
                    </span>
                  </div>
                  <div className="divider"></div>
                  <div style={{ fontSize:12, color:'var(--text-dim)', display:'flex', flexDirection:'column', gap:4, fontFamily:'JetBrains Mono,monospace' }}>
                    <div>Matches: <span style={{ color:'var(--text)' }}>{combatPreview.totalMatches}</span></div>
                    <div>Divergence: <span style={{ color:'var(--text)' }}>×{combatPreview.avgMultiplier.toFixed(2)}</span></div>
                    <div>Innate: <span style={{ color:'var(--text)' }}>+{combatPreview.innateImmunity}</span></div>
                  </div>
                  {/* Active effects summary */}
                  {activeEffects.length > 0 && (
                    <div style={{ marginTop:10 }}>
                      <div className="divider"></div>
                      {activeEffects.map((eff, i) => (
                        <div key={i} style={{ fontSize:11, marginTop:4, color: eff.type.includes('Penalty') || eff.type === 'halveCombat' || eff.type === 'negateInnate' || eff.type === 'noBoosts' || eff.type === 'loseTags' || eff.type === 'disableAlleleResolved' || eff.type === 'pathogenBoost' ? 'var(--red)' : 'var(--green)' }}>
                          {eff.type === 'combatBonus' && `✅ +${eff.value} combat (${eff.label || 'Bonus'})`}
                          {eff.type === 'memoryBoost' && `🛡️ +${eff.value} combat (Immune Memory)`}
                          {eff.type === 'combatPenalty' && eff.reason === 'herdImmunity' && `❌ -${eff.value} combat (No Herd Immunity)`}
                          {eff.type === 'combatPenalty' && !eff.reason && `❌ -${eff.value} combat (Malnutrition)`}
                          {eff.type === 'memoryPenalty' && `⚠️ -${eff.value} combat (Antigenic Sin)`}
                          {eff.type === 'halveCombat' && '❌ Combat halved (Immunosuppression)'}
                          {eff.type === 'negateInnate' && '❌ Innate immunity negated'}
                          {eff.type === 'divergenceBonus' && `✅ Divergence +${eff.value}x`}
                          {eff.type === 'divergencePenalty' && `❌ Divergence -${eff.value}x`}
                          {eff.type === 'innateBonus' && `✅ +${eff.value} innate immunity`}
                          {eff.type === 'noBoosts' && '❌ No boost modifiers (Cytokine Depletion)'}
                          {eff.type === 'loseTags' && '❌ Tags reduced (Antigenic Drift)'}
                          {eff.type === 'pathogenBoost' && `❌ Pathogen +${eff.percent ? `${(eff.value*100).toFixed(0)}%` : eff.value} power`}
                          {eff.type === 'disableAlleleResolved' && `❌ Allele ${eff.index + 1} disabled (Fatigue)`}
                          {eff.type === 'randomTagResolved' && `✅ [${eff.tag}] added (Minor Vaccine)`}
                        </div>
                      ))}
                    </div>
                  )}
                  {combatPreview.neutralizedTag && (
                    <div style={{ marginTop:8, fontSize:11, color:'var(--green)', fontFamily:'JetBrains Mono,monospace' }}>
                      🎯 Neutralized {combatPreview.neutralizedTag} (−{combatPreview.neutralizedTag === 'Immune-Evasion' ? 5 : 3} power)
                    </div>
                  )}
                  {playedModifiers.length > 0 && (
                    <div style={{ marginTop:8, display:'flex', flexWrap:'wrap', gap:4 }}>
                      {playedModifiers.map((m, i) => {
                        const isAbx = m.effect === 'antibiotics';
                        const effectiveVal = isAbx ? Math.max(0, m.value - antibioticResistance) : null;
                        const fullyResistant = isAbx && effectiveVal === 0;
                        const label = isAbx
                          ? `Antibiotics (−${effectiveVal}${fullyResistant ? ' ⚠️' : ''})`
                          : (m.effect === 'neutralize' && m.selectedTag)
                          ? `Neutralizing Ab (−${m.selectedTag})`
                          : m.name;
                        return (
                          <span key={i} style={{ fontSize:10, padding:'2px 7px', borderRadius:20,
                            background:'rgba(155,109,220,0.15)', border:'1px solid rgba(155,109,220,0.35)',
                            color: fullyResistant ? 'var(--red)' : 'var(--purple)',
                            fontFamily:'JetBrains Mono,monospace' }}>
                            {label}
                          </span>
                        );
                      })}
                    </div>
                  )}
                </>
              )}
            </div>
          </div>

          {/* Modifier Hand */}
          {modifierHand.length > 0 && (
            <div className="panel" style={{ padding:'14px 18px', marginBottom:14 }}>
              <div className="section-title">MODIFIER HAND — click to play</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                {modifierHand.map((mod) => {
                  const noBoosts = activeEffects.find(e => e.type === 'noBoosts');
                  const isDisabled = noBoosts && mod.type === 'boost';
                  return (
                    <button key={mod.id} disabled={isDisabled} className="modifier-hand-card"
                      onClick={() => playModifier(mod)}
                      style={{ opacity: isDisabled ? 0.4 : 1, cursor: isDisabled ? 'not-allowed' : 'pointer' }}>
                      <div style={{ fontSize:13, fontWeight:700, color:'var(--purple)', marginBottom:3 }}>{mod.name}</div>
                      <div style={{ fontSize:11, color:'var(--text-dim)' }}>
                        {mod.effect === 'antibiotics'
                          ? `Reduce power by ${Math.max(0, mod.value - antibioticResistance)} vs Bacterial-Toxin${antibioticResistance > 0 ? ` (−${antibioticResistance} resistance)` : ''}`
                          : mod.description}
                      </div>
                      {mod.effect === 'antibiotics' && antibioticResistance >= mod.value && (
                        <div style={{ fontSize:10, color:'var(--red)', marginTop:3, fontWeight:600 }}>⚠️ Fully resistant — no effect</div>
                      )}
                    </button>
                  );
                })}
              </div>
              {activeEffects.find(e => e.type === 'noBoosts') && (
                <div style={{ marginTop:8, fontSize:12, color:'var(--red)' }}>⚠️ Boost modifiers blocked by Cytokine Depletion</div>
              )}
            </div>
          )}

          <div style={{ textAlign:'center' }}>
            <button className="btn-fight" onClick={fight}><Swords /> FIGHT</button>
          </div>
        </div>
      )}

      {/* ─── RESULT ─── */}
      {gameState === 'result' && combatResult && currentPathogen && (
        <div className="fade-in">
          <div className={`panel ${!combatResult.win ? 'shake-anim' : ''}`} style={{ padding:'28px', maxWidth:540, margin:'0 auto 20px' }}>
            <div style={{ textAlign:'center', marginBottom:20 }}>
              <div style={{ fontSize:28, fontWeight:700, letterSpacing:3, color: combatResult.win ? 'var(--green)' : 'var(--red)',
                textShadow: `0 0 24px ${combatResult.win ? 'var(--green)' : 'var(--red)'}`, marginBottom:4 }}>
                {combatResult.win ? '◆ VICTORY' : '◆ DEFEATED'}
              </div>
              <div style={{ fontSize:13, color:'var(--text-dim)' }}>{currentPathogen.name}</div>
            </div>

            <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:16, marginBottom:20 }}>
              <div style={{ textAlign:'center' }}>
                <div style={{ fontSize:11, color:'var(--text-dim)', letterSpacing:1, marginBottom:2 }}>YOUR COMBAT</div>
                <CountUpNumber target={combatResult.combatValue} duration={700}
                  style={{ fontSize:48, fontWeight:700, fontFamily:'JetBrains Mono,monospace', color: combatResult.win ? 'var(--green)' : 'var(--red)' }} />
              </div>
              <div style={{ fontSize:18, color:'var(--text-dim)', fontFamily:'JetBrains Mono,monospace' }}>vs</div>
              <div style={{ textAlign:'center' }}>
                <div style={{ fontSize:11, color:'var(--text-dim)', letterSpacing:1, marginBottom:2 }}>PATHOGEN POWER</div>
                <CountUpNumber target={combatResult.effectivePathogenPower} duration={700}
                  style={{ fontSize:48, fontWeight:700, fontFamily:'JetBrains Mono,monospace', color:'var(--red)' }} />
              </div>
            </div>

            <div className="divider"></div>
            <div style={{ fontSize:12, color:'var(--text-dim)', marginBottom:10, fontFamily:'JetBrains Mono,monospace' }}>
              ({combatResult.totalMatches} matches × {combatResult.avgMultiplier.toFixed(2)}) + {combatResult.innateImmunity} innate = {combatResult.combatValue}
            </div>

            {combatResult.matchDetails.length > 0 && (
              <div style={{ marginBottom:12 }}>
                <div className="section-title">MATCHED TAGS</div>
                {combatResult.matchDetails.map((d, i) => (
                  <div key={i} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                    <span style={{ fontSize:11, color:'var(--text-dim)', fontFamily:'JetBrains Mono,monospace', minWidth:50 }}>{d.allele}</span>
                    <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                      {d.tags.map((t, j) => (
                        <span key={j} className="tag-pill matched tag-glow-in" style={{ animationDelay: `${i*0.12 + j*0.06}s` }}>{t}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {combatResult.win
              ? <div style={{ textAlign:'center', padding:'10px', background:'var(--green-light)', border:'1px solid #86efac', borderRadius:8, color:'var(--green)', fontSize:13 }}>+{currentPathogen.reward} credit{currentPathogen.reward>1?'s':''} earned</div>
              : <div className="shake-anim" style={{ textAlign:'center', padding:'10px', background:'rgba(255,45,85,0.08)', border:'1px solid rgba(255,45,85,0.3)', borderRadius:8, color:'var(--red)', fontSize:13 }}>Took {combatResult.effectivePathogenPower - combatResult.combatValue} damage</div>
            }
          </div>
          <div style={{ textAlign:'center' }}>
            <button className="btn-primary" onClick={proceedToEvent}><SkipForward /> CONTINUE</button>
          </div>
        </div>
      )}

      {/* ─── EVENT ─── */}
      {gameState === 'event' && (
        <div className="fade-in">
          <div style={{ maxWidth:420, margin:'0 auto 20px' }}>
            {currentEvent ? (
              <div className={`${currentEvent.type === 'curse' ? 'event-card-curse curse-reveal' : 'event-card-bonus bonus-reveal'}`} style={{ padding:'28px' }}>
                <div style={{ textAlign:'center', marginBottom:16 }}>
                  <div style={{ fontSize:36, marginBottom:8 }}>{currentEvent.type === 'curse' ? '⚠️' : '⭐'}</div>
                  <div style={{ fontSize:11, letterSpacing:2, fontWeight:700, color: currentEvent.type === 'curse' ? 'var(--red)' : 'var(--green)', marginBottom:4 }}>
                    {currentEvent.type === 'curse' ? 'COMPLICATION' : 'BONUS EVENT'}
                  </div>
                  <div style={{ fontSize:20, fontWeight:700 }}>{currentEvent.event.name}</div>
                </div>
                <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:8, padding:'14px 16px', marginBottom:12 }}>
                  <div style={{ fontSize:14, color:'var(--text)' }}>{currentEvent.event.description}</div>
                </div>
                <div style={{ fontSize:12, color:'var(--text-dim)', textAlign:'center', fontStyle:'italic' }}>
                  {currentEvent.type === 'curse' ? 'Your immune system is under stress...' : 'Your body has adapted!'}
                </div>
              </div>
            ) : (
              <div className="event-card-neutral" style={{ padding:'28px', textAlign:'center' }}>
                <div style={{ fontSize:28, marginBottom:8 }}>✓</div>
                <div style={{ fontSize:16, fontWeight:600, color:'var(--text)' }}>No Complications</div>
                <div style={{ fontSize:13, color:'var(--text-dim)', marginTop:6 }}>Your immune system remains stable</div>
              </div>
            )}
          </div>
          <div style={{ textAlign:'center' }}>
            <button className="btn-primary" onClick={proceedToMarket}><Flask /> VISIT MARKET</button>
          </div>
        </div>
      )}

      {/* ─── MARKET ─── */}
      {gameState === 'market' && (
        <div className="fade-in">
          <div style={{ textAlign:'center', marginBottom:20 }}>
            <div style={{ fontSize:22, fontWeight:700, color:'#4a90d9' }}>Market</div>
            <div style={{ fontSize:13, color:'var(--text-dim)', marginTop:4 }}>
              <span style={{ fontFamily:'JetBrains Mono,monospace', color:'var(--yellow)' }}>{credits}</span> credits available •
              <span style={{ fontFamily:'JetBrains Mono,monospace', color:'#4a90d9' }}> {40 - credits}</span> more to win
            </div>
          </div>

          {/* Tabs */}
          <div style={{ display:'flex', gap:2, marginBottom:0, borderBottom:'1px solid var(--border)', paddingBottom:0 }}>
            <button className={`market-tab ${marketTab === 'modifiers' ? 'active' : ''}`} onClick={() => { setMarketTab('modifiers'); setSwapMode(null); setSwapNotice(null); }}>
              🧪 MODIFIERS
            </button>
            <button className={`market-tab ${marketTab === 'lab' ? 'active' : ''}`} onClick={() => { setMarketTab('lab'); setSwapMode(null); setSwapNotice(null); }}>
              <Dna /> GENOMIC LAB
            </button>
          </div>

          {/* Modifiers Tab */}
          {marketTab === 'modifiers' && (
            <div className="panel" style={{ padding:'20px', borderTopLeftRadius:0 }}>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))', gap:12 }}>
                {marketModifiers.map((mod, idx) => {
                  const ownedCount = modifierHand.filter(m => m.effect === mod.effect).length;
                  return (
                  <div key={idx} className="modifier-card">
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
                      <div style={{ fontSize:14, fontWeight:700 }}>{mod.name}</div>
                      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                        {ownedCount > 0 && (
                          <span style={{ fontSize:10, padding:'1px 6px', borderRadius:4,
                            background:'rgba(155,109,220,0.15)', border:'1px solid rgba(155,109,220,0.3)',
                            color:'var(--purple)', fontFamily:'JetBrains Mono,monospace' }}>
                            ×{ownedCount} in hand
                          </span>
                        )}
                        <div style={{ fontFamily:'JetBrains Mono,monospace', fontSize:14, fontWeight:600,
                          color: credits >= mod.cost ? 'var(--yellow)' : 'var(--text-dim)' }}>{mod.cost} cr</div>
                      </div>
                    </div>
                    <div style={{ fontSize:12, color:'var(--text-dim)', marginBottom: mod.effect === 'antibiotics' ? 4 : 10 }}>
                      {mod.effect === 'antibiotics'
                        ? `Reduce power by ${Math.max(0, mod.value - antibioticResistance)} vs Bacterial-Toxin. Loses −1 effect per use (resistance).`
                        : mod.description}
                    </div>
                    {mod.effect === 'antibiotics' && (
                      <div style={{ fontSize:11, marginBottom:10,
                        color: antibioticResistance === 0 ? 'var(--green)' : antibioticResistance >= mod.value ? 'var(--red)' : 'var(--yellow)',
                        fontWeight:600 }}>
                        {antibioticResistance === 0
                          ? '✓ Full strength (−3)'
                          : antibioticResistance >= mod.value
                          ? '⚠️ Fully resistant — no effect'
                          : `⚠️ Resistance −${antibioticResistance} (was −${mod.value})`}
                      </div>
                    )}
                    <button onClick={() => buyModifier(mod)} disabled={credits < mod.cost}
                      style={{ width:'100%', padding:'8px', borderRadius:6, fontFamily:'Inter,sans-serif',
                        fontWeight:700, fontSize:13, cursor: credits >= mod.cost ? 'pointer' : 'not-allowed',
                        background: credits >= mod.cost ? 'rgba(155,109,220,0.15)' : 'rgba(100,100,100,0.1)',
                        border: `1px solid ${credits >= mod.cost ? 'rgba(155,109,220,0.5)' : '#4a4f57'}`,
                        color: credits >= mod.cost ? 'var(--purple)' : 'var(--text-dim)',
                        transition:'all 0.15s' }}>
                      {credits >= mod.cost ? `Purchase${ownedCount > 0 ? ' again' : ''}` : 'Insufficient Credits'}
                    </button>
                  </div>
                  );
                })}
              </div>
              {modifierHand.length > 0 && (
                <div style={{ marginTop:16 }}>
                  <div className="divider"></div>
                  <div className="section-title">YOUR HAND</div>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                    {modifierHand.map((mod, idx) => (
                      <span key={idx} style={{ fontSize:11, padding:'3px 10px', borderRadius:20, background:'rgba(191,95,255,0.1)', border:'1px solid rgba(191,95,255,0.3)', color:'var(--purple)' }}>{mod.name}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Genomic Lab Tab */}
          {marketTab === 'lab' && (
            <div className="panel" style={{ padding:'20px', borderTopLeftRadius:0 }}>
              <div style={{ marginBottom:16, padding:'12px 16px', background:'#1e2d42', border:'1px solid var(--border)', borderRadius:8 }}>
                <div style={{ fontSize:13, color:'#4a90d9', fontWeight:600, marginBottom:4 }}>Genomic Lab — Allele Swap</div>
                <div style={{ fontSize:12, color:'var(--text-dim)' }}>
                  Swap one of your alleles for a new one. Cost: <span style={{ color:'var(--yellow)', fontFamily:'JetBrains Mono,monospace' }}>5 credits</span> per swap.
                  Gene A alleles (A-*) can only replace Gene A positions; Gene B (B-*) for Gene B.
                </div>
              </div>

              {swapMode && (
                <div style={{ marginBottom:14, padding:'10px 14px', background:'var(--accent-light)', border:'1px solid var(--accent)', borderRadius:8 }}>
                  <div style={{ fontSize:13, color:'#4a90d9', marginBottom:4 }}>
                    Replacing with: <strong>{swapMode.shopAllele.name}</strong>
                  </div>
                  <div style={{ fontSize:11, color:'var(--text-dim)' }}>↑ Select the allele position in your genome above to replace</div>
                  <button onClick={() => { setSwapMode(null); setSwapNotice(null); }} className="btn-secondary" style={{ marginTop:8, fontSize:11, padding:'5px 12px' }}>Cancel</button>
                </div>
              )}

              {swapNotice && (
                <div className="fade-in" style={{ marginBottom:14, padding:'10px 14px', background:'var(--red-light)', border:'1px solid #7a3a3a', borderRadius:8, fontSize:12, color:'#e07070' }}>
                  ⚠️ {swapNotice}
                </div>
              )}

              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
                {/* Gene A shop */}
                <div>
                  <div style={{ fontSize:11, fontWeight:700, letterSpacing:2, color:'var(--text-dim)', marginBottom:10 }}>GENE A ALLELES</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    {shopAlleles.filter(a => Object.values(ALLELES.geneA).flat().some(ga => ga.id === a.id)).map((allele, idx) => {
                      const isSelected = swapMode && swapMode.shopAllele.id === allele.id;
                      return (
                        <div key={idx}>
                          <AlleleCard allele={allele} small selectable={credits >= 5 && !swapMode}
                            selected={isSelected}
                            onSelect={() => initSwap(allele)} />
                          <button onClick={() => initSwap(allele)} disabled={credits < 5 || !!swapMode}
                            style={{ marginTop:5, width:'100%', padding:'5px', borderRadius:5, fontSize:11, fontFamily:'Inter,sans-serif', fontWeight:700, cursor: credits >= 5 && !swapMode ? 'pointer' : 'not-allowed',
                              background: credits >= 5 && !swapMode ? 'var(--accent-light)' : '#32363b',
                              border: `1px solid ${credits >= 5 && !swapMode ? '#4a90d9' : '#4a4f57'}`,
                              color: credits >= 5 && !swapMode ? '#4a90d9' : 'var(--text-dim)', transition:'all 0.2s' }}>
                            {credits < 5 ? 'Need 5 cr' : swapMode ? 'Select position ↑' : 'Swap (5 cr)'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
                {/* Gene B shop */}
                <div>
                  <div style={{ fontSize:11, fontWeight:700, letterSpacing:2, color:'var(--text-dim)', marginBottom:10 }}>GENE B ALLELES</div>
                  <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                    {shopAlleles.filter(a => Object.values(ALLELES.geneB).flat().some(gb => gb.id === a.id)).map((allele, idx) => {
                      const isSelected = swapMode && swapMode.shopAllele.id === allele.id;
                      return (
                        <div key={idx}>
                          <AlleleCard allele={allele} small selectable={credits >= 5 && !swapMode}
                            selected={isSelected}
                            onSelect={() => initSwap(allele)} />
                          <button onClick={() => initSwap(allele)} disabled={credits < 5 || !!swapMode}
                            style={{ marginTop:5, width:'100%', padding:'5px', borderRadius:5, fontSize:11, fontFamily:'Inter,sans-serif', fontWeight:700, cursor: credits >= 5 && !swapMode ? 'pointer' : 'not-allowed',
                              background: credits >= 5 && !swapMode ? 'var(--accent-light)' : '#32363b',
                              border: `1px solid ${credits >= 5 && !swapMode ? '#4a90d9' : '#4a4f57'}`,
                              color: credits >= 5 && !swapMode ? '#4a90d9' : 'var(--text-dim)', transition:'all 0.2s' }}>
                            {credits < 5 ? 'Need 5 cr' : swapMode ? 'Select position ↑' : 'Swap (5 cr)'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          <div style={{ textAlign:'center', marginTop:20 }}>
            <button className="btn-secondary" onClick={skipMarket} style={{ padding:'11px 28px', fontSize:14 }}>
              Skip Market & Continue →
            </button>
          </div>
        </div>
      )}

      {/* ─── GAME OVER ─── */}
      {gameState === 'gameover' && (
        <div className="fade-in panel" style={{ maxWidth:420, margin:'40px auto', padding:'40px', textAlign:'center' }}>
          <div style={{ fontSize:36, marginBottom:8 }}>💀</div>
          <div style={{ fontSize:28, fontWeight:700, color:'var(--red)', letterSpacing:3, marginBottom:16 }}>GAME OVER</div>
          <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:6 }}>Survived <span style={{ color:'var(--text)', fontFamily:'JetBrains Mono,monospace' }}>{round}</span> rounds</div>
          <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:24 }}>Final credits: <span style={{ color:'var(--yellow)', fontFamily:'JetBrains Mono,monospace' }}>{credits}</span> · {Object.keys(encounteredPathogens).length} unique pathogens encountered</div>
          <button className="btn-primary" onClick={startNewGame}><Shuffle /> PLAY AGAIN</button>
        </div>
      )}

      {/* ─── VICTORY ─── */}
      {gameState === 'victory' && (
        <>
          <ConfettiBurst />
          <div className="fade-in panel" style={{ maxWidth:420, margin:'40px auto', padding:'40px', textAlign:'center' }}>
            <div style={{ fontSize:36, marginBottom:8 }}>🏆</div>
            <div style={{ fontSize:28, fontWeight:700, color:'var(--green)', letterSpacing:3, textShadow:'0 0 24px var(--green)', marginBottom:16 }}>VICTORY</div>
            <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:6 }}>Accumulated <span style={{ color:'var(--yellow)', fontFamily:'JetBrains Mono,monospace' }}>40 credits</span> across {round} rounds</div>
            <div style={{ fontSize:14, color:'var(--text-dim)', marginBottom:24 }}>Survived with <span style={{ color:'var(--green)', fontFamily:'JetBrains Mono,monospace' }}>{health} HP</span> remaining · {Object.keys(encounteredPathogens).length} unique pathogens encountered</div>
            <button className="btn-primary" onClick={startNewGame}><Shuffle /> PLAY AGAIN</button>
          </div>
        </>
      )}

      {/* Battle Log */}
      {battleLog.length > 0 && !['gameover','victory'].includes(gameState) && (
        <div className="panel" style={{ marginTop:20, padding:'16px 18px' }}>
          <div className="section-title">BATTLE LOG</div>
          <div style={{ maxHeight:160, overflowY:'auto', display:'flex', flexDirection:'column', gap:4 }}>
            {battleLog.slice().reverse().map((log, idx) => (
              <div key={idx} className="log-entry" style={{ background: log.result.startsWith('WIN') ? 'rgba(61,186,110,0.08)' : 'rgba(224,85,85,0.08)', borderLeft:`2px solid ${log.result.startsWith('WIN') ? 'var(--green)' : 'var(--red)'}` }}>
                <span style={{ color:'var(--text-dim)' }}>R{log.round}</span>
                {' '}
                <span style={{ color:'var(--text)' }}>{log.pathogen}</span>
                {' — '}
                <span style={{ color: log.result.startsWith('WIN') ? 'var(--green)' : 'var(--red)' }}>{log.result.startsWith('WIN') ? 'WIN' : 'LOSE'}</span>
                {' '}
                <span style={{ color:'var(--text-dim)' }}>({log.combat} vs {log.power}){log.damage ? ` −${log.damage}hp` : ''}</span>
                {log.memory === 'boost' && <span title="Immune memory boost" style={{ marginLeft:4 }}>🛡️</span>}
                {log.memory === 'penalty' && <span title="Original antigenic sin" style={{ marginLeft:4 }}>⚠️</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HLACardGame />);
</script>
</body>
</html>
